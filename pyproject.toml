[project]
name = "erpgen"
version = "0.1.0"
description = "Synthetic SAP-style order-to-cash data with labeled ground truth"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]
desktop = ["PySide6>=6.6"]

[project.scripts]
erpgen = "erpgen.cli:main"
erpgen-desktop = "desktop_app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["desktop_app"]

[tool.setuptools.packages.find]
include = ["erpgen*"]
